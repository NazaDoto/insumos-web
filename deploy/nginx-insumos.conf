# /etc/nginx/sites-available/insumos.nazadoto.com
# Sistema de Gestion de Insumos
#
# - Sirve el frontend (build de Vite) desde dist/
# - Hace proxy de /api hacia el backend Express (puerto 3506)
#
# Activar:  sudo ln -s /etc/nginx/sites-available/insumos.nazadoto.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    server_name insumos.nazadoto.com;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # Las lineas ssl_certificate las agrega Certbot automaticamente.

    # ---- API (backend Express) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Frontend SPA ----
    location / {
        root /var/www/nazadoto/portfolio/insumos-web/insumos-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Redireccion HTTP -> HTTPS
server {
    listen 80;
    server_name insumos.nazadoto.com;
    return 301 https://insumos.nazadoto.com$request_uri;
}
